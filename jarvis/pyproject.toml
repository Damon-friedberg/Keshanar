[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "A Claude-powered voice assistant for Windows (voice + MCP + computer control)."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
jarvis = "jarvis.main:main"
jarvis-chat = "jarvis.chat:main"
jarvis-doctor = "jarvis.doctor:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
